name: publish

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    name: Publish extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Package extension
        run: pnpm exec vsce package --no-dependencies --out extension.vsix

      - name: Publish to VS Marketplace
        run: pnpm exec vsce publish --packagePath extension.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}

      - name: Publish to Open VSX
        run: pnpm exec ovsx publish extension.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
