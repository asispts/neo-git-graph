name: publish

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    name: Deploy to ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: VS Marketplace
            pat: VS_MARKETPLACE_TOKEN
            registryUrl: https://marketplace.visualstudio.com
          - name: Open VSX
            pat: OPEN_VSX_TOKEN
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Publish to ${{ matrix.name }}
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets[matrix.pat] }}
          registryUrl: ${{ matrix.registryUrl || '' }}
          dependencies: false
